x402_paywall.settings:
  type: config_object
  label: 'x402 Paywall settings'
  mapping:
    facilitator_url:
      type: uri
      label: 'Facilitator URL'
    pay_to:
      type: string
      label: 'Wallet address that receives payments'
    network:
      type: string
      label: 'Network (CAIP-2 id)'
    asset:
      type: string
      label: 'Token contract address'
    asset_name:
      type: string
      label: 'Token name used for signing'
    asset_version:
      type: string
      label: 'Token version used for signing'
    timeout:
      type: integer
      label: 'Facilitator request timeout (seconds)'
